name: 'Build Android APK'
description: 'Setup Android keystore and build APK'

inputs:
  keystore-base64:
    description: 'Base64 encoded keystore file'
    required: true
  keystore-password:
    description: 'Keystore password'
    required: true
  key-alias:
    description: 'Key alias'
    required: true
  key-password:
    description: 'Key password'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup release keystore
      shell: bash
      run: |
        echo "${{ inputs.keystore-base64 }}" | base64 --decode > android/app/release-keystore.jks
        echo "storeFile=release-keystore.jks" > android/key.properties
        echo "storePassword=${{ inputs.keystore-password }}" >> android/key.properties
        echo "keyAlias=${{ inputs.key-alias }}" >> android/key.properties
        echo "keyPassword=${{ inputs.key-password }}" >> android/key.properties

    - name: Build APK
      shell: bash
      run: |
        flutter clean
        flutter build apk --release
