name: 'Setup iOS Ruby'
description: 'Setup Ruby and Bundler for iOS build'

inputs:
  use-github-action:
    description: 'Use ruby/setup-ruby action (GitHub-hosted only)'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Ruby (GitHub-hosted)
      if: inputs.use-github-action == 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ios

    - name: Setup Ruby (Self-hosted)
      if: inputs.use-github-action != 'true'
      shell: bash
      run: |
        ruby --version
        gem --version
        if ! command -v bundle &> /dev/null; then
          gem install bundler
        fi

    - name: Install Fastlane dependencies
      if: inputs.use-github-action != 'true'
      shell: bash
      run: |
        cd ios
        bundle install --path vendor/bundle
