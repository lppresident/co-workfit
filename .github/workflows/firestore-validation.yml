name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Firestore configuration
        run: |
          echo "## Firestore Configuration Check" >> $GITHUB_STEP_SUMMARY

          # Check files exist
          if [ -f "firestore.indexes.json" ]; then
            echo "- firestore.indexes.json exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "- firestore.indexes.json MISSING" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ -f "firestore.rules" ]; then
            echo "- firestore.rules exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "- firestore.rules MISSING" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run Firestore config tests
        run: |
          echo "### Firestore Config Tests" >> $GITHUB_STEP_SUMMARY
          flutter test test/core/data/firestore_config_test.dart --reporter github 2>&1 | tee test_output.txt
          if [ $? -eq 0 ]; then
            echo "- All Firestore config tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Firestore config tests FAILED" >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run all tests
        run: |
          echo "### All Tests" >> $GITHUB_STEP_SUMMARY
          flutter test --reporter github 2>&1 | tee all_test_output.txt
          if [ $? -eq 0 ]; then
            echo "- All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Some tests FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Flutter analyze
        run: |
          echo "### Static Analysis" >> $GITHUB_STEP_SUMMARY
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt
          RESULT=$?

          # Count issues
          ERRORS=$(grep -c "error •" analyze_output.txt || echo "0")
          WARNINGS=$(grep -c "warning •" analyze_output.txt || echo "0")
          INFOS=$(grep -c "info •" analyze_output.txt || echo "0")

          echo "- Errors: $ERRORS" >> $GITHUB_STEP_SUMMARY
          echo "- Warnings: $WARNINGS" >> $GITHUB_STEP_SUMMARY
          echo "- Infos: $INFOS" >> $GITHUB_STEP_SUMMARY

          if [ $RESULT -ne 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Analysis failed - see details below:" >> $GITHUB_STEP_SUMMARY
            grep "error •\|warning •" analyze_output.txt >> $GITHUB_STEP_SUMMARY || true
            exit 1
          fi

  firestore-deploy-check:
    name: Firestore Deploy Readiness
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Firestore files changed
        id: check_changes
        run: |
          # Get changed files in this push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          INDEXES_CHANGED="false"
          RULES_CHANGED="false"

          if echo "$CHANGED_FILES" | grep -q "firestore.indexes.json"; then
            INDEXES_CHANGED="true"
          fi

          if echo "$CHANGED_FILES" | grep -q "firestore.rules"; then
            RULES_CHANGED="true"
          fi

          echo "indexes_changed=$INDEXES_CHANGED" >> $GITHUB_OUTPUT
          echo "rules_changed=$RULES_CHANGED" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Firestore Deploy Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.indexes_changed }}" == "true" ]; then
            echo "- **firestore.indexes.json** changed - deploy required" >> $GITHUB_STEP_SUMMARY
            echo "  \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "  firebase deploy --only firestore:indexes" >> $GITHUB_STEP_SUMMARY
            echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.check_changes.outputs.rules_changed }}" == "true" ]; then
            echo "- **firestore.rules** changed - deploy required" >> $GITHUB_STEP_SUMMARY
            echo "  \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "  firebase deploy --only firestore:rules" >> $GITHUB_STEP_SUMMARY
            echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.check_changes.outputs.indexes_changed }}" == "false" ] && [ "${{ steps.check_changes.outputs.rules_changed }}" == "false" ]; then
            echo "- No Firestore configuration changes detected" >> $GITHUB_STEP_SUMMARY
          fi
