name: Test TestFlight Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Test API Key Connection
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          
          # 환경변수 확인 (값은 마스킹)
          echo "=== Environment Variables Check ==="
          echo "APP_STORE_CONNECT_API_KEY_ID: ${APP_STORE_CONNECT_API_KEY_ID:+SET (${#APP_STORE_CONNECT_API_KEY_ID} chars)}"
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${APP_STORE_CONNECT_API_KEY_ISSUER_ID:+SET (${#APP_STORE_CONNECT_API_KEY_ISSUER_ID} chars)}"
          echo "APP_STORE_CONNECT_API_KEY_CONTENT: ${APP_STORE_CONNECT_API_KEY_CONTENT:+SET (${#APP_STORE_CONNECT_API_KEY_CONTENT} chars)}"
          
          # Fastlane으로 API 연결 테스트
          echo ""
          echo "=== Testing App Store Connect API ==="
          fastlane run app_store_connect_api_key \
            key_id:"$APP_STORE_CONNECT_API_KEY_ID" \
            issuer_id:"$APP_STORE_CONNECT_API_KEY_ISSUER_ID" \
            key_content:"$APP_STORE_CONNECT_API_KEY_CONTENT" \
            is_key_content_base64:true

      - name: List Apps (Test API Access)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          
          # 앱 목록 조회 테스트
          echo "=== Fetching App List from App Store Connect ==="
          cat > /tmp/test_api.rb << 'EOF'
          require 'spaceship'
          
          key_id = ENV['APP_STORE_CONNECT_API_KEY_ID']
          issuer_id = ENV['APP_STORE_CONNECT_API_KEY_ISSUER_ID']
          key_content = ENV['APP_STORE_CONNECT_API_KEY_CONTENT']
          
          puts "Connecting to App Store Connect..."
          
          # Base64 디코딩
          require 'base64'
          decoded_key = Base64.decode64(key_content)
          
          token = Spaceship::ConnectAPI::Token.create(
            key_id: key_id,
            issuer_id: issuer_id,
            key: decoded_key
          )
          
          Spaceship::ConnectAPI.token = token
          
          puts "Connected! Fetching apps..."
          apps = Spaceship::ConnectAPI::App.all
          
          puts "\n=== Apps in your account ==="
          apps.each do |app|
            puts "- #{app.bundle_id} (#{app.name})"
          end
          
          # 특정 앱 찾기
          target_app = apps.find { |a| a.bundle_id == 'com.hansol.coworkfit' }
          if target_app
            puts "\n✅ Found target app: #{target_app.name}"
          else
            puts "\n❌ App 'com.hansol.coworkfit' NOT found in your account!"
            puts "Available bundle IDs:"
            apps.each { |a| puts "  - #{a.bundle_id}" }
          end
          EOF
          
          ruby /tmp/test_api.rb

