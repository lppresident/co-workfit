name: Deploy Android (Firebase)

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '버전 증가 타입 (major/minor/patch/build)'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - patch
          - minor
          - major
      release_notes:
        description: '릴리스 노트'
        required: false
        default: 'New test release'
      deploy_to_firebase:
        description: 'Firebase App Distribution에 배포'
        required: true
        default: true
        type: boolean
      deploy_to_github:
        description: 'GitHub Release 생성'
        required: true
        default: false
        type: boolean
      runner_type:
        description: 'Runner 선택'
        required: true
        default: 'self-hosted-first'
        type: choice
        options:
          - self-hosted-first    # Self-hosted 먼저 시도, 실패시 GitHub runner
          - self-hosted-only     # Self-hosted만 사용
          - github-hosted        # GitHub runner만 사용

jobs:
  # ==================== Self-hosted 먼저 시도 ====================
  build-self-hosted:
    if: github.event.inputs.runner_type != 'github-hosted'
    runs-on: self-hosted
    timeout-minutes: 15  # Self-hosted는 빠르므로 짧은 타임아웃
    continue-on-error: ${{ github.event.inputs.runner_type == 'self-hosted-first' }}

    outputs:
      success: ${{ steps.build_result.outputs.success }}
      new_version: ${{ steps.bump_version.outputs.new_version }}
      version_name: ${{ steps.bump_version.outputs.version_name }}
      build_number: ${{ steps.bump_version.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Bump version
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          case "$VERSION_BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
            patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
            build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"
          
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          else
            sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          flutter clean
          flutter build apk --release

      - name: Deploy to Firebase
        if: github.event.inputs.deploy_to_firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes }}
            Version: ${{ steps.bump_version.outputs.new_version }}
            Commit: ${{ github.sha }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-self-hosted
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: pubspec.yaml
          retention-days: 1

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== GitHub-hosted Fallback ====================
  build-github-hosted:
    needs: build-self-hosted
    # Self-hosted가 실패했거나 스킵됐을 때, 또는 github-hosted를 직접 선택했을 때
    if: |
      always() && (
        github.event.inputs.runner_type == 'github-hosted' ||
        (github.event.inputs.runner_type == 'self-hosted-first' && needs.build-self-hosted.outputs.success != 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      version_name: ${{ steps.bump_version.outputs.version_name }}
      build_number: ${{ steps.bump_version.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Bump version
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          case "$VERSION_BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
            patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
            build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          flutter clean
          flutter build apk --release

      - name: Deploy to Firebase
        if: github.event.inputs.deploy_to_firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes }}
            Version: ${{ steps.bump_version.outputs.new_version }}
            Commit: ${{ github.sha }}
            (Built on GitHub-hosted runner)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-github-hosted
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: pubspec.yaml
          retention-days: 1

  # ==================== Commit & Release ====================
  finalize:
    needs: [build-self-hosted, build-github-hosted]
    if: always() && (needs.build-self-hosted.outputs.success == 'true' || needs.build-github-hosted.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download version info
        uses: actions/download-artifact@v4
        with:
          name: version-info
        continue-on-error: true

      - name: Determine version
        id: version
        run: |
          if [ -f pubspec.yaml ]; then
            VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          else
            VERSION="${{ needs.build-self-hosted.outputs.new_version || needs.build-github-hosted.outputs.new_version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml || true
          git commit -m "chore: Bump version to ${{ steps.version.outputs.version }}" || echo "No changes"
          git push || echo "Push failed"

      - name: Download APK (self-hosted)
        if: needs.build-self-hosted.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-apk-self-hosted
          path: ./apk
        continue-on-error: true

      - name: Download APK (github-hosted)
        if: needs.build-github-hosted.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk-github-hosted
          path: ./apk
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event.inputs.deploy_to_github == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CoWorkfit v${{ steps.version.outputs.version }}
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_notes }}

            ## Details
            - Version: ${{ steps.version.outputs.version }}
            - Commit: ${{ github.sha }}
            - Runner: ${{ needs.build-self-hosted.outputs.success == 'true' && 'Self-hosted' || 'GitHub-hosted' }}
          files: ./apk/app-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Summary ====================
  summary:
    needs: [build-self-hosted, build-github-hosted, finalize]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## 🤖 Android Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Self-hosted | ${{ needs.build-self-hosted.outputs.success == 'true' && '✅ 성공' || needs.build-self-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패/오프라인' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub-hosted | ${{ needs.build-github-hosted.result == 'success' && '✅ 성공 (Fallback)' || needs.build-github-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 배포 결과" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase**: ${{ github.event.inputs.deploy_to_firebase == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.event.inputs.deploy_to_github == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
