name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '배포 대상'
        required: true
        default: 'all'
        type: choice
        options:
          - all     # Android + iOS 모두 배포
          - android # Android만 배포 (Play Store)
          - ios     # iOS만 배포 (TestFlight)
      version_bump:
        description: '버전 증가 타입'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - patch
          - minor
          - major
      release_notes:
        description: '릴리스 노트'
        required: false
        default: 'New test release'
      create_github_release:
        description: 'GitHub Release 생성 (Android APK 포함)'
        required: true
        default: false
        type: boolean
      runner_type:
        description: 'Runner 선택'
        required: true
        default: 'self-hosted-first'
        type: choice
        options:
          - self-hosted-first    # Self-hosted 먼저 시도, 실패시 GitHub runner
          - self-hosted-only     # Self-hosted만 사용
          - github-hosted        # GitHub runner만 사용

jobs:
  # ==================== 버전 계산 (한번만) ====================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      version_name: ${{ steps.bump_version.outputs.version_name }}
      build_number: ${{ steps.bump_version.outputs.build_number }}
      deploy_android: ${{ steps.check_target.outputs.deploy_android }}
      deploy_ios: ${{ steps.check_target.outputs.deploy_ios }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy target
        id: check_target
        run: |
          TARGET="${{ github.event.inputs.deploy_target }}"

          # Android 배포 여부
          if [[ "$TARGET" == "all" || "$TARGET" == "android" ]]; then
            echo "deploy_android=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_android=false" >> $GITHUB_OUTPUT
          fi

          # iOS 배포 여부
          if [[ "$TARGET" == "all" || "$TARGET" == "ios" ]]; then
            echo "deploy_ios=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_ios=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate version
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          case "$VERSION_BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
            patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
            build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "## 📦 Deploy Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.deploy_target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: $NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Type**: ${{ github.event.inputs.runner_type }}" >> $GITHUB_STEP_SUMMARY

  # ==================== Android Play Store: Self-hosted ====================
  android-playstore-self-hosted:
    needs: prepare
    if: needs.prepare.outputs.deploy_android == 'true' && github.event.inputs.runner_type != 'github-hosted'
    runs-on: self-hosted
    timeout-minutes: 20
    continue-on-error: ${{ github.event.inputs.runner_type == 'self-hosted-first' }}

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          else
            sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          fi

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Setup Play Store credentials
        run: |
          echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > android/app/play-store-credentials.json

      - name: Build AAB
        run: |
          flutter clean
          flutter build appbundle --release

      - name: Deploy to Play Store
        run: |
          cd android
          ./gradlew publishBundle --track internal

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f android/app/play-store-credentials.json
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-self-hosted
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== Android Play Store: GitHub-hosted Fallback ====================
  android-playstore-github-hosted:
    needs: [prepare, android-playstore-self-hosted]
    if: |
      always() && needs.prepare.outputs.deploy_android == 'true' && (
        github.event.inputs.runner_type == 'github-hosted' ||
        (github.event.inputs.runner_type == 'self-hosted-first' && needs.android-playstore-self-hosted.outputs.success != 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Setup Play Store credentials
        run: |
          echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > android/app/play-store-credentials.json

      - name: Build AAB
        run: |
          flutter clean
          flutter build appbundle --release

      - name: Deploy to Play Store
        run: |
          cd android
          ./gradlew publishBundle --track internal

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f android/app/play-store-credentials.json
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-github-hosted
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== iOS: Self-hosted ====================
  ios-self-hosted:
    needs: prepare
    if: needs.prepare.outputs.deploy_ios == 'true' && github.event.inputs.runner_type != 'github-hosted'
    runs-on: self-hosted
    timeout-minutes: 60
    continue-on-error: ${{ github.event.inputs.runner_type == 'self-hosted-first' }}

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Setup Ruby and Bundler
        run: |
          ruby --version
          gem --version
          if ! command -v bundle &> /dev/null; then
            gem install bundler
          fi

      - name: Install Fastlane dependencies
        run: |
          cd ios
          bundle install --path vendor/bundle

      - name: Build and Upload to TestFlight
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane beta changelog:"${{ github.event.inputs.release_notes }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-self-hosted
          path: build/ios/ipa/co_workfit.ipa
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== iOS: GitHub-hosted Fallback ====================
  ios-github-hosted:
    needs: [prepare, ios-self-hosted]
    if: |
      always() && needs.prepare.outputs.deploy_ios == 'true' && (
        github.event.inputs.runner_type == 'github-hosted' ||
        (github.event.inputs.runner_type == 'self-hosted-first' && needs.ios-self-hosted.outputs.success != 'true')
      )
    runs-on: macos-latest
    timeout-minutes: 45

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Build and Upload to TestFlight
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane beta changelog:"${{ github.event.inputs.release_notes }} (Built on GitHub-hosted runner)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-github-hosted
          path: build/ios/ipa/co_workfit.ipa
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== Finalize ====================
  finalize:
    needs: [prepare, android-playstore-self-hosted, android-playstore-github-hosted, ios-self-hosted, ios-github-hosted]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Commit version bump
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: Bump version to $NEW_VERSION" || echo "No changes"
          
          # Pull 먼저 받고 push (원격에 새 커밋이 있을 경우 대비)
          git pull --rebase origin ${{ github.ref_name }} || echo "Pull failed or no changes"
          git push || echo "Push failed"

      - name: Download Android AAB (self-hosted)
        if: needs.android-playstore-self-hosted.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-aab-self-hosted
          path: ./aab
        continue-on-error: true

      - name: Download Android AAB (github-hosted)
        if: needs.android-playstore-github-hosted.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-aab-github-hosted
          path: ./aab
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.new_version }}
          name: CoWorkfit v${{ needs.prepare.outputs.new_version }}
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_notes }}

            ## Details
            - Version: ${{ needs.prepare.outputs.new_version }}
            - Commit: ${{ github.sha }}
            
            ## Build Info
            - Android Play Store: ${{ needs.android-playstore-self-hosted.outputs.success == 'true' && 'Self-hosted ✅' || needs.android-playstore-github-hosted.outputs.success == 'true' && 'GitHub-hosted ✅' || '⏭️ 스킵' }}
            - iOS: ${{ needs.ios-self-hosted.outputs.success == 'true' && 'Self-hosted ✅' || needs.ios-github-hosted.outputs.success == 'true' && 'GitHub-hosted ✅' || '⏭️ 스킵' }}
          files: ./aab/app-release.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Summary ====================
  summary:
    needs: [prepare, android-playstore-self-hosted, android-playstore-github-hosted, ios-self-hosted, ios-github-hosted, finalize]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${{ github.event.inputs.deploy_target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Runner**: ${{ github.event.inputs.runner_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.prepare.outputs.deploy_android }}" == "true" ]]; then
            echo "### 🤖 Android Play Store (Internal Track)" >> $GITHUB_STEP_SUMMARY
            echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Self-hosted | ${{ needs.android-playstore-self-hosted.outputs.success == 'true' && '✅ 성공' || needs.android-playstore-self-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패/오프라인' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| GitHub-hosted | ${{ needs.android-playstore-github-hosted.outputs.success == 'true' && '✅ 성공 (Fallback)' || needs.android-playstore-github-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.prepare.outputs.deploy_ios }}" == "true" ]]; then
            echo "### 🍎 iOS (TestFlight)" >> $GITHUB_STEP_SUMMARY
            echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Self-hosted | ${{ needs.ios-self-hosted.outputs.success == 'true' && '✅ 성공' || needs.ios-self-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패/오프라인' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| GitHub-hosted | ${{ needs.ios-github-hosted.outputs.success == 'true' && '✅ 성공 (Fallback)' || needs.ios-github-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 📋 Options" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.event.inputs.create_github_release == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY

