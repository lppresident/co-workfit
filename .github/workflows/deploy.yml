name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '배포 대상'
        required: true
        default: 'all'
        type: choice
        options:
          - all       # Android + iOS 모두 배포
          - android   # Android만 배포 (Firebase)
          - ios       # iOS만 배포 (TestFlight)
      version_bump:
        description: '버전 증가 타입'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - patch
          - minor
          - major
      release_notes:
        description: '릴리스 노트'
        required: false
        default: 'New test release'
      create_github_release:
        description: 'GitHub Release 생성 (Android APK 포함)'
        required: true
        default: false
        type: boolean
      runner_type:
        description: 'Runner 선택'
        required: true
        default: 'self-hosted-first'
        type: choice
        options:
          - self-hosted-first    # Self-hosted 먼저 시도, 실패시 GitHub runner
          - self-hosted-only     # Self-hosted만 사용
          - github-hosted        # GitHub runner만 사용

jobs:
  # ==================== 준비: 버전 계산 + Flutter 설정 (한번만) ====================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      version_name: ${{ steps.bump_version.outputs.version_name }}
      build_number: ${{ steps.bump_version.outputs.build_number }}
      deploy_android: ${{ steps.check_target.outputs.deploy_android }}
      deploy_ios: ${{ steps.check_target.outputs.deploy_ios }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy target
        id: check_target
        run: |
          TARGET="${{ github.event.inputs.deploy_target }}"
          if [[ "$TARGET" == "all" || "$TARGET" == "android" ]]; then
            echo "deploy_android=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_android=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "ios" ]]; then
            echo "deploy_ios=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_ios=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate version
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          case "$VERSION_BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
            patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
            build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "## 📦 Deploy Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.deploy_target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: $NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Type**: ${{ github.event.inputs.runner_type }}" >> $GITHUB_STEP_SUMMARY

      # Flutter setup을 여기서 한 번만 수행
      - name: Setup Flutter (once for all)
        uses: ./.github/actions/setup-flutter
        with:
          new-version: ${{ steps.bump_version.outputs.new_version }}

      # 버전 업데이트된 소스를 아티팩트로 공유
      - name: Upload prepared source
        uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: |
            .
            !.git
          retention-days: 1

  # ==================== Android 빌드 ====================
  build-android:
    needs: prepare
    if: needs.prepare.outputs.deploy_android == 'true'
    runs-on: ${{ github.event.inputs.runner_type == 'github-hosted' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30

    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: .

      - name: Build Android
        uses: ./.github/actions/build-android
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # macOS self-hosted는 CLI, Linux는 Docker action 사용
      - name: Deploy to Firebase (CLI)
        if: runner.os == 'macOS'
        run: |
          if ! command -v firebase &> /dev/null; then
            echo "Installing Firebase CLI..."
            curl -sL https://firebase.tools | bash
          fi

          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase-service-account.json"

          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "${{ github.event.inputs.release_notes }}
          Version: ${{ needs.prepare.outputs.new_version }}
          Commit: ${{ github.sha }}"

          rm -f firebase-service-account.json

      - name: Deploy to Firebase (Action)
        if: runner.os == 'Linux'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes }}
            Version: ${{ needs.prepare.outputs.new_version }}
            Commit: ${{ github.sha }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ==================== iOS 빌드 ====================
  build-ios:
    needs: prepare
    if: needs.prepare.outputs.deploy_ios == 'true'
    runs-on: ${{ github.event.inputs.runner_type == 'github-hosted' && 'macos-latest' || 'self-hosted' }}
    timeout-minutes: 60

    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: .

      - name: Setup iOS Ruby
        uses: ./.github/actions/setup-ios-ruby
        with:
          use-github-action: ${{ github.event.inputs.runner_type == 'github-hosted' && 'true' || 'false' }}

      - name: Build and Upload to TestFlight
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane beta changelog:"${{ github.event.inputs.release_notes }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/co_workfit.ipa
          retention-days: 7

  # ==================== Finalize ====================
  finalize:
    needs: [prepare, build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Commit version bump
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: Bump version to $NEW_VERSION" || echo "No changes"
          git push || echo "Push failed"

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./apk
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.new_version }}
          name: CoWorkfit v${{ needs.prepare.outputs.new_version }}
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_notes }}

            ## Details
            - Version: ${{ needs.prepare.outputs.new_version }}
            - Commit: ${{ github.sha }}
            
            ## Build Info
            - Android: ${{ needs.build-android.result == 'success' && '✅' || needs.build-android.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }}
            - iOS: ${{ needs.build-ios.result == 'success' && '✅' || needs.build-ios.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }}
            - Runner: ${{ github.event.inputs.runner_type }}
          files: ./apk/app-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Summary ====================
  summary:
    needs: [prepare, build-android, build-ios, finalize]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${{ github.event.inputs.deploy_target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Runner**: ${{ github.event.inputs.runner_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.prepare.outputs.deploy_android }}" == "true" ]]; then
            echo "### 🤖 Android (Firebase App Distribution)" >> $GITHUB_STEP_SUMMARY
            echo "**Status**: ${{ needs.build-android.result == 'success' && '✅ 성공' || needs.build-android.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.prepare.outputs.deploy_ios }}" == "true" ]]; then
            echo "### 🍎 iOS (TestFlight)" >> $GITHUB_STEP_SUMMARY
            echo "**Status**: ${{ needs.build-ios.result == 'success' && '✅ 성공' || needs.build-ios.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📋 Options" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.event.inputs.create_github_release == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY

