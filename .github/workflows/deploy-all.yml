name: Deploy All (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '버전 증가 타입'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - patch
          - minor
          - major
      release_notes:
        description: '릴리스 노트'
        required: false
        default: 'New build'
      deploy_android:
        description: 'Android 배포 (Firebase)'
        required: true
        default: true
        type: boolean
      deploy_ios:
        description: 'iOS 배포 (TestFlight)'
        required: true
        default: true
        type: boolean
      create_github_release:
        description: 'GitHub Release 생성 (APK만)'
        required: true
        default: false
        type: boolean

jobs:
  # ==================== Android Build ====================
  build-android:
    if: github.event.inputs.deploy_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Bump version
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          case "$VERSION_BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
            patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
            build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $CURRENT_VERSION → $NEW_VERSION"

      - name: Build APK
        run: flutter build apk --release

      - name: Deploy to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes }}
            Version: ${{ steps.bump_version.outputs.new_version }}

      - name: Upload APK artifact
        if: github.event.inputs.create_github_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: pubspec.yaml
          retention-days: 1

    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      version_name: ${{ steps.bump_version.outputs.version_name }}
      build_number: ${{ steps.bump_version.outputs.build_number }}

  # ==================== iOS Build ====================
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: build-android
    # Android가 스킵되거나 실패해도 iOS는 실행
    if: always() && github.event.inputs.deploy_ios == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download version info (if Android ran)
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: version-info
        continue-on-error: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Bump version (if Android didn't run)
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          # Android에서 이미 버전을 올렸으면 그대로 사용
          if [ "${{ needs.build-android.result }}" != "success" ]; then
            MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
            MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
            PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

            case "$VERSION_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
              patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
              build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
            esac

            NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"
            sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
            VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          else
            NEW_VERSION="$CURRENT_VERSION"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $NEW_VERSION"

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Install Fastlane
        run: |
          cd ios
          gem install fastlane

      - name: Setup temporary keychain
        run: |
          security create-keychain -p "" fastlane_tmp_keychain
          security default-keychain -s fastlane_tmp_keychain
          security unlock-keychain -p "" fastlane_tmp_keychain
          security set-keychain-settings -t 3600 -u fastlane_tmp_keychain

      - name: Update iOS version
        run: |
          VERSION_NAME="${{ steps.bump_version.outputs.version_name }}"
          BUILD_NUMBER="${{ steps.bump_version.outputs.build_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Runner/Info.plist

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build IPA for TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          fastlane build_appstore

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          fastlane upload_testflight changelog:"${{ github.event.inputs.release_notes }}"

  # ==================== Commit Version ====================
  commit-version:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download version info
        uses: actions/download-artifact@v4
        with:
          name: version-info
        continue-on-error: true

      - name: Read version
        id: read_version
        run: |
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: Bump version to ${{ steps.read_version.outputs.new_version }}" || echo "No changes"
          git push || echo "Push failed"

  # ==================== GitHub Release (APK only) ====================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event.inputs.create_github_release == 'true' && needs.build-android.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download version info
        uses: actions/download-artifact@v4
        with:
          name: version-info
        continue-on-error: true

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./android-artifacts

      - name: Read version
        id: read_version
        run: |
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Get APK info
        id: apk_info
        run: |
          APK_SIZE=$(du -h ./android-artifacts/app-release.apk | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.read_version.outputs.new_version }}
          name: CoWorkfit v${{ steps.read_version.outputs.new_version }}
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_notes }}
            
            ## Version Info
            - **Version**: ${{ steps.read_version.outputs.version_name }}
            - **Build**: ${{ steps.read_version.outputs.build_number }}
            - **APK Size**: ${{ steps.apk_info.outputs.apk_size }}
            
            ## Installation
            - **Android**: Download APK and install (enable unknown sources)
            - **iOS**: Use TestFlight for installation
          files: ./android-artifacts/app-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Summary ====================
  summary:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, create-release]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | 배포 위치 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result == 'success' && '✅' || needs.build-android.result == 'skipped' && '⏭️ 스킵' || '❌' }} | Firebase App Distribution |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result == 'success' && '✅' || needs.build-ios.result == 'skipped' && '⏭️ 스킵' || '❌' }} | TestFlight |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.create-release.result == 'success' && '✅' || needs.create-release.result == 'skipped' && '⏭️ 스킵' || '❌' }} | GitHub Releases |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 설치 방법" >> $GITHUB_STEP_SUMMARY
          echo "- **Android**: Firebase App Distribution 앱에서 설치" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS**: TestFlight 앱에서 설치 (내부 테스터)" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub**: Releases 페이지에서 APK/IPA 직접 다운로드" >> $GITHUB_STEP_SUMMARY
