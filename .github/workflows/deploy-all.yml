name: Deploy All (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '버전 증가 타입 (major/minor/patch/build)'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - patch
          - minor
          - major
      release_notes:
        description: '릴리스 노트'
        required: false
        default: 'New test release'
      deploy_android_firebase:
        description: 'Android: Firebase App Distribution에 배포'
        required: true
        default: true
        type: boolean
      deploy_android_github:
        description: 'Android: GitHub Release 생성'
        required: true
        default: false
        type: boolean
      deploy_ios:
        description: 'iOS: TestFlight에 배포'
        required: true
        default: true
        type: boolean
      runner_type:
        description: 'Runner 선택'
        required: true
        default: 'self-hosted-first'
        type: choice
        options:
          - self-hosted-first    # Self-hosted 먼저 시도, 실패시 GitHub runner
          - self-hosted-only     # Self-hosted만 사용
          - github-hosted        # GitHub runner만 사용

jobs:
  # ==================== 버전 계산 (한번만) ====================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      version_name: ${{ steps.bump_version.outputs.version_name }}
      build_number: ${{ steps.bump_version.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate version
        id: bump_version
        run: |
          VERSION_BUMP="${{ github.event.inputs.version_bump || 'build' }}"
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          case "$VERSION_BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_NUMBER=1 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0; BUILD_NUMBER=1 ;;
            patch) PATCH=$((PATCH + 1)); BUILD_NUMBER=1 ;;
            build) BUILD_NUMBER=$((BUILD_NUMBER + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "## 📦 Version Info" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: $NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Type**: ${{ github.event.inputs.runner_type }}" >> $GITHUB_STEP_SUMMARY

  # ==================== Android: Self-hosted ====================
  android-self-hosted:
    needs: prepare
    if: github.event.inputs.runner_type != 'github-hosted'
    runs-on: self-hosted
    timeout-minutes: 15
    continue-on-error: ${{ github.event.inputs.runner_type == 'self-hosted-first' }}

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          else
            sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          fi

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Build APK
        run: |
          flutter clean
          flutter build apk --release

      # macOS self-hosted에서는 Docker 기반 액션 사용 불가 → Firebase CLI 직접 사용
      - name: Deploy to Firebase (via CLI)
        if: github.event.inputs.deploy_android_firebase == 'true'
        run: |
          # Firebase CLI 설치 (없으면)
          if ! command -v firebase &> /dev/null; then
            echo "Installing Firebase CLI..."
            curl -sL https://firebase.tools | bash
          fi
          
          # 서비스 계정 키 저장
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase-service-account.json"
          
          # Firebase App Distribution에 배포
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "${{ github.event.inputs.release_notes }}
          Version: ${{ needs.prepare.outputs.new_version }}
          Commit: ${{ github.sha }}"
          
          # 키 파일 삭제
          rm -f firebase-service-account.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-self-hosted
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== Android: GitHub-hosted Fallback ====================
  android-github-hosted:
    needs: [prepare, android-self-hosted]
    if: |
      always() && (
        github.event.inputs.runner_type == 'github-hosted' ||
        (github.event.inputs.runner_type == 'self-hosted-first' && needs.android-self-hosted.outputs.success != 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties

      - name: Build APK
        run: |
          flutter clean
          flutter build apk --release

      # Linux에서는 Docker 기반 액션 사용 가능
      - name: Deploy to Firebase
        if: github.event.inputs.deploy_android_firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes }}
            Version: ${{ needs.prepare.outputs.new_version }}
            Commit: ${{ github.sha }}
            (Built on GitHub-hosted runner)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-github-hosted
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== iOS: Self-hosted ====================
  ios-self-hosted:
    needs: prepare
    if: github.event.inputs.deploy_ios == 'true' && github.event.inputs.runner_type != 'github-hosted'
    runs-on: self-hosted
    timeout-minutes: 20
    continue-on-error: ${{ github.event.inputs.runner_type == 'self-hosted-first' }}

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Setup Ruby and Bundler
        run: |
          # Ruby가 설치되어 있는지 확인
          ruby --version
          gem --version
          
          # Bundler 설치 (없으면)
          if ! command -v bundle &> /dev/null; then
            gem install bundler
          fi

      - name: Install Fastlane dependencies
        run: |
          cd ios
          bundle install --path vendor/bundle

      - name: Setup Fastlane Match
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          cd ios
          bundle exec fastlane match appstore --readonly

      - name: Build iOS
        run: |
          cd ios
          flutter build ios --release --no-codesign
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions-AppStore.plist

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane pilot upload \
            --ipa build/ipa/Runner.ipa \
            --skip_waiting_for_build_processing true \
            --changelog "${{ github.event.inputs.release_notes }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-self-hosted
          path: ios/build/ipa/Runner.ipa
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== iOS: GitHub-hosted Fallback ====================
  ios-github-hosted:
    needs: [prepare, ios-self-hosted]
    if: |
      always() && github.event.inputs.deploy_ios == 'true' && (
        github.event.inputs.runner_type == 'github-hosted' ||
        (github.event.inputs.runner_type == 'self-hosted-first' && needs.ios-self-hosted.outputs.success != 'true')
      )
    runs-on: macos-latest
    timeout-minutes: 45

    outputs:
      success: ${{ steps.build_result.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update version
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i '' "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Setup Fastlane Match
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          cd ios
          bundle exec fastlane match appstore --readonly

      - name: Build iOS
        run: |
          cd ios
          flutter build ios --release --no-codesign
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions-AppStore.plist

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane pilot upload \
            --ipa build/ipa/Runner.ipa \
            --skip_waiting_for_build_processing true \
            --changelog "${{ github.event.inputs.release_notes }} (Built on GitHub-hosted runner)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-github-hosted
          path: ios/build/ipa/Runner.ipa
          retention-days: 7

      - name: Mark success
        id: build_result
        run: echo "success=true" >> $GITHUB_OUTPUT

  # ==================== Finalize ====================
  finalize:
    needs: [prepare, android-self-hosted, android-github-hosted, ios-self-hosted, ios-github-hosted]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Commit version bump
        run: |
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: Bump version to $NEW_VERSION" || echo "No changes"
          git push || echo "Push failed"

      - name: Download Android APK (self-hosted)
        if: needs.android-self-hosted.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-apk-self-hosted
          path: ./apk
        continue-on-error: true

      - name: Download Android APK (github-hosted)
        if: needs.android-github-hosted.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-apk-github-hosted
          path: ./apk
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event.inputs.deploy_android_github == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.new_version }}
          name: CoWorkfit v${{ needs.prepare.outputs.new_version }}
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_notes }}

            ## Details
            - Version: ${{ needs.prepare.outputs.new_version }}
            - Commit: ${{ github.sha }}
            
            ## Build Info
            - Android: ${{ needs.android-self-hosted.outputs.success == 'true' && 'Self-hosted ✅' || needs.android-github-hosted.outputs.success == 'true' && 'GitHub-hosted ✅' || '❌' }}
            - iOS: ${{ needs.ios-self-hosted.outputs.success == 'true' && 'Self-hosted ✅' || needs.ios-github-hosted.outputs.success == 'true' && 'GitHub-hosted ✅' || '❌' }}
          files: ./apk/app-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Summary ====================
  summary:
    needs: [prepare, android-self-hosted, android-github-hosted, ios-self-hosted, ios-github-hosted, finalize]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Full Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Runner Type**: ${{ github.event.inputs.runner_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Android" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Self-hosted | ${{ needs.android-self-hosted.outputs.success == 'true' && '✅ 성공' || needs.android-self-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패/오프라인' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub-hosted | ${{ needs.android-github-hosted.outputs.success == 'true' && '✅ 성공 (Fallback)' || needs.android-github-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🍎 iOS" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Self-hosted | ${{ needs.ios-self-hosted.outputs.success == 'true' && '✅ 성공' || needs.ios-self-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패/오프라인' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub-hosted | ${{ needs.ios-github-hosted.outputs.success == 'true' && '✅ 성공 (Fallback)' || needs.ios-github-hosted.result == 'skipped' && '⏭️ 스킵' || '❌ 실패' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 배포 대상" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase App Distribution**: ${{ github.event.inputs.deploy_android_firebase == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.event.inputs.deploy_android_github == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TestFlight**: ${{ github.event.inputs.deploy_ios == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
